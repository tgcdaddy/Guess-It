<title>Guess It</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#07050f; --panel:rgba(22,15,44,.74); --panel2:rgba(40,29,76,.82); --line:rgba(167,139,250,.30);
    --text:#f1ecff; --muted:#bdb2e0; --accent:#f5c451; --accent2:#f59e0b; --accent-ink:#1c1400;
    --violet:#8b5cf6;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100vh; color:var(--text);
    background:
      radial-gradient(900px 520px at 50% -8%, rgba(109,40,217,.38) 0%, transparent 62%),
      radial-gradient(700px 500px at 100% 100%, rgba(30,64,175,.28) 0%, transparent 60%),
      var(--bg);
    background-attachment:fixed;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Tahoma, "Noto Sans Arabic", system-ui, sans-serif;
    line-height:1.45;
    padding:max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    overflow-x:hidden;
  }

  /* ---------- atmosphere layers ---------- */
  .fx-bg{position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:0; background-size:cover; background-position:center; transition:opacity 1.2s ease}
  body.has-bg .fx-bg{opacity:.9; background-image:var(--bg-img)}
  .fog{position:fixed; z-index:-1; pointer-events:none; width:140vmax; height:140vmax; border-radius:50%; filter:blur(60px); opacity:.5}
  .fog.a{left:-70vmax; top:-40vmax; background:radial-gradient(circle, rgba(124,58,237,.30), transparent 60%); animation:drift1 38s ease-in-out infinite alternate}
  .fog.b{right:-80vmax; bottom:-60vmax; background:radial-gradient(circle, rgba(20,184,166,.18), transparent 60%); animation:drift2 46s ease-in-out infinite alternate}
  @keyframes drift1{to{transform:translate(28vmax, 16vmax) scale(1.15)}}
  @keyframes drift2{to{transform:translate(-26vmax, -18vmax) scale(1.2)}}
  #fx{position:fixed; inset:0; z-index:-1; pointer-events:none}
  main{max-width:520px; margin:0 auto}

  /* ---------- type ---------- */
  h1{
    font-family:Georgia, "Palatino Linotype", "Times New Roman", "Noto Naskh Arabic", serif;
    font-size:30px; margin:6px 0 4px; letter-spacing:1px; text-align:center; font-weight:700;
    text-shadow:0 0 18px rgba(167,139,250,.75), 0 0 2px rgba(245,196,81,.6);
    animation:flicker 6s ease-in-out infinite;
  }
  @keyframes flicker{0%,100%{opacity:1} 46%{opacity:1} 48%{opacity:.82} 50%{opacity:1} 71%{opacity:.93} 73%{opacity:1}}
  p{margin:8px 0}
  .muted{color:var(--muted)}
  .hint{text-align:center; font-style:italic; color:var(--muted)}
  .whisper{
    text-align:center; font-style:italic; color:#d9ccff; margin:6px 0 0; min-height:1.5em;
    text-shadow:0 0 12px rgba(167,139,250,.8); animation:breathe 3.6s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:.55} 50%{opacity:1}}

  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:16px; margin-top:16px;
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    box-shadow:0 10px 40px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.03);
  }

  /* ---------- the orb ---------- */
  .orb{position:relative; width:var(--s,120px); height:var(--s,120px); margin:calc(var(--s,120px) * .3) auto}
  .orb .runes{
    position:absolute; inset:-24%; border-radius:50%;
    border:1px dashed rgba(245,196,81,.55);
    box-shadow:0 0 18px rgba(245,196,81,.20), inset 0 0 18px rgba(245,196,81,.12);
    animation:spin 46s linear infinite;
  }
  .orb .runes::after{content:""; position:absolute; inset:9%; border-radius:50%; border:1px dotted rgba(167,139,250,.6); animation:spin 30s linear infinite reverse}
  body.has-runes .orb .runes{border:0; box-shadow:none; background:var(--runes-img) center/contain no-repeat; mix-blend-mode:screen; opacity:.9}
  body.has-runes .orb .runes::after{display:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  .orb .ball{
    position:absolute; inset:0; border-radius:50%; overflow:hidden;
    background:radial-gradient(circle at 34% 28%, rgba(255,255,255,.85) 0 4%, #c4b5fd 14%, #7c3aed 42%, #2e1065 72%, #0f0626 100%);
    box-shadow:0 0 calc(26px + 46px*var(--p,.35)) rgba(139,92,246,calc(.5 + .4*var(--p,.35))), inset 0 0 22px rgba(255,255,255,.18);
    animation:pulse 4.2s ease-in-out infinite;
  }
  body.has-orb .orb .ball{background:var(--orb-img) center/158% no-repeat; mix-blend-mode:screen}
  .orb .ball::before{ /* drifting inner light */
    content:""; position:absolute; inset:-30%;
    background:conic-gradient(from 0deg, transparent 0 55%, rgba(245,196,81,.35) 70%, transparent 85%);
    animation:spin 9s linear infinite; mix-blend-mode:screen;
  }
  .orb .eye{position:absolute; left:50%; top:50%; width:46%; transform:translate(-50%,-50%); animation:blink 7s ease-in-out infinite; transform-origin:center; z-index:2; filter:drop-shadow(0 0 6px rgba(255,214,102,.8))}
  @keyframes blink{0%,91%,100%{transform:translate(-50%,-50%) scaleY(1)} 95%{transform:translate(-50%,-50%) scaleY(.08)}}
  @keyframes pulse{0%,100%{transform:scale(1)} 50%{transform:scale(1.045)}}
  .orb .ping{position:absolute; inset:0; border-radius:50%; border:2px solid rgba(245,196,81,.9); opacity:0; pointer-events:none}
  .orb.go .ping{animation:ping .9s ease-out}
  @keyframes ping{from{opacity:.9; transform:scale(1)} to{opacity:0; transform:scale(2.6)}}

  /* ---------- chips ---------- */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:4px 0}
  .grid.by-column{grid-auto-flow:column; grid-template-rows:repeat(10, auto)}
  .chip{
    display:flex; align-items:center; gap:8px; min-height:48px;
    background:var(--panel2); border:1px solid var(--line); border-radius:12px;
    padding:8px 10px; font-size:15px;
    animation:rise .55s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i,0) * 45ms);
  }
  @keyframes rise{from{opacity:0; transform:translateY(10px) scale(.96); filter:blur(5px)} to{opacity:1; transform:none; filter:none}}
  .chip .icon{font-size:22px; line-height:1; flex:none}
  .chip .nm{flex:1; min-width:0}
  .chip .no{flex:none; width:2.3ch; direction:ltr; unicode-bidi:isolate; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums}


  /* compact list screen: fit on one screen without scrolling */
  #screen-list #orb-list{--s:clamp(40px,8dvh,80px) !important; margin-block:calc(var(--s) * .12)}
  #screen-list h1{font-size:26px; margin:0}
  #screen-list .hint{margin:2px 0 0; font-size:14px}
  #screen-list .ghost{min-height:36px; padding:4px 10px}
  #screen-list > div:first-of-type{margin-top:8px !important}
  #screen-list .primary{min-height:42px; padding:8px 14px; font-size:17px}
  #screen-list .panel{padding:8px; margin-top:10px; border-radius:16px}
  #screen-list .grid{gap:4px; margin:0}
  #screen-list .chip{min-height:32px; padding:2px 8px; gap:6px; font-size:13px; line-height:1.15; border-radius:10px}
  #screen-list .chip .icon{font-size:18px}

  /* ---------- buttons ---------- */
  button{
    font:inherit; cursor:pointer; border-radius:14px; min-height:52px; padding:12px 18px;
    color:var(--text); background:var(--panel2); border:1px solid var(--line);
  }
  button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  button:active{transform:scale(.98)}
  .primary{
    position:relative; overflow:hidden; width:100%; font-size:18px; font-weight:700; border-color:transparent; color:var(--accent-ink);
    background:linear-gradient(135deg,#fde68a,var(--accent) 45%,var(--accent2));
    box-shadow:0 0 22px rgba(245,196,81,.35), 0 6px 18px rgba(0,0,0,.4);
  }
  .primary::after{content:""; position:absolute; top:0; bottom:0; width:40%; left:-60%; background:linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent); transform:skewX(-20deg); animation:shine 4.5s ease-in-out infinite}
  @keyframes shine{0%,60%{left:-60%} 100%{left:130%}}
  .ghost{background:transparent; color:var(--muted); min-height:44px; padding:8px 4px; border-color:transparent}
  .row{display:grid; grid-template-columns:1fr 1.4fr; gap:10px; margin-top:16px}
  .row button{width:100%; font-size:17px; font-weight:700}

  /* ---------- radios ---------- */
  fieldset{border:0; margin:18px 0 0; padding:0; min-width:0}
  legend{padding:0; margin-bottom:8px; font-size:14px; font-weight:600; color:var(--muted); letter-spacing:.3px}
  .opts{display:grid; gap:8px}
  .opts.two{grid-template-columns:1fr 1fr}
  .opt{
    display:flex; align-items:center; gap:12px; min-height:56px; padding:10px 14px; cursor:pointer;
    background:var(--panel); border:1px solid var(--line); border-radius:14px; font-size:18px; font-weight:600;
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); transition:box-shadow .25s, border-color .25s;
  }
  .opt:has(input:checked){border-color:var(--accent); background:var(--panel2); box-shadow:0 0 18px rgba(245,196,81,.28)}
  .opt:has(input:focus-visible){outline:3px solid var(--accent); outline-offset:2px}
  .opt input{width:22px; height:22px; margin:0; accent-color:var(--accent); flex:none}
  .opt .e{font-size:24px; line-height:1}

  /* ---------- page chrome ---------- */
  .top{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .top h1{text-align:start; margin:0; font-size:22px}
  .badge{background:var(--panel2); border:1px solid var(--line); border-radius:999px; padding:4px 12px; font-size:14px; color:var(--muted); white-space:nowrap}
  .bar{height:8px; background:rgba(255,255,255,.07); border-radius:99px; overflow:hidden; margin-top:12px}
  .bar > i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--violet),var(--accent)); box-shadow:0 0 14px rgba(245,196,81,.7); border-radius:99px; transition:width .5s ease}
  .q{font-size:20px; font-weight:700; margin:14px 0 2px}
  .snd{
    position:fixed; z-index:5; inset-inline-end:14px; bottom:max(14px, env(safe-area-inset-bottom));
    width:48px; height:48px; min-height:0; padding:0; border-radius:50%; font-size:22px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel); border:1px solid var(--line); box-shadow:0 0 16px rgba(139,92,246,.35);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  }
  .snd[aria-pressed="false"]{opacity:.7; box-shadow:none}
  .enter > :not(.orb){animation:enter .7s ease both}
  @keyframes enter{from{opacity:0; transform:translateY(8px); filter:blur(8px)} to{opacity:1; transform:none; filter:none}}
  [hidden]{display:none !important}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none !important; transition:none !important}
  }
</style>

</main>

    whisper: ['ركّز في اختيارك...', 'أمسك به بوضوح في ذهنك...', 'أشعر به يتشكّل...',
              'الصورة تزداد وضوحًا...', 'اقتربنا...', 'لمحة أخيرة...']
  }
};

let lang = 'en';
let catIndex = 0;
let step = 0;                 // 0..5 = which page is on screen
const t = () => T[lang];
const cat = () => CATEGORIES[catIndex];
const label = c => (lang === 'ar' && c.ar) ? c.ar : c.name;       // car brands have no Arabic name
const title = c => lang === 'ar' ? c.titleAr : c.title;
const icon = c => c.icon ? `<span class="icon" aria-hidden="true">${c.icon}</span>` : '';
const buzz = ms => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };


/* ---------- magical sound (everything is synthesised, no audio files) ---------- */
const Sound = (() => {
  const DRONE = [110.00, 164.81, 220.00, 261.63, 329.63, 493.88];          // A minor, a little open: A2 E3 A3 C4 E4 B4
  const PENT  = [440.00, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66, 1318.51, 1567.98]; // A minor pentatonic
  let ctx = null, master = null, ambBus = null, fxBus = null, analyser = null, noise = null, timer = 0;
  let on = true;
  try { on = localStorage.getItem('guessit-sound') !== 'off'; } catch (e) {}

  const running = () => ctx && ctx.state === 'running';

  function impulse(sec, decay){
    const len = Math.floor(ctx.sampleRate * sec), buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++){
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }
  function makeNoise(){
    const len = ctx.sampleRate * 2, b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++){ last = last * .98 + (Math.random() * 2 - 1) * .02; d[i] = last * 8; }
    return b;
  }

  function init(){
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor();
    master = ctx.createGain();  master.gain.value = on ? 1 : 0;
    analyser = ctx.createAnalyser(); analyser.fftSize = 1024;
    master.connect(comp); comp.connect(ctx.destination); comp.connect(analyser);

    const verb = ctx.createConvolver(); verb.buffer = impulse(2.8, 2.4);
    const wet = ctx.createGain(); wet.gain.value = .5; verb.connect(wet); wet.connect(master);
    ambBus = ctx.createGain(); ambBus.gain.value = 0; ambBus.connect(master); ambBus.connect(verb);
    fxBus  = ctx.createGain(); fxBus.gain.value = 1.15;  fxBus.connect(master);  fxBus.connect(verb);
    noise = makeNoise();
    startAmbient();
  }

  function startAmbient(){
    const t = ctx.currentTime;
    DRONE.forEach((f, i) => {
      [-4, 4].forEach(det => {
        const o = ctx.createOscillator(); o.type = i < 3 ? 'sine' : 'triangle'; o.frequency.value = f; o.detune.value = det;
        const g = ctx.createGain(); g.gain.value = i < 3 ? .06 : .028;
        const lfo = ctx.createOscillator(); lfo.frequency.value = .04 + Math.random() * .08;
        const lg = ctx.createGain(); lg.gain.value = i < 3 ? .05 : .024;
        lfo.connect(lg); lg.connect(g.gain);
        o.connect(g); g.connect(ambBus); o.start(t); lfo.start(t);
      });
    });
    // soft wind
    const w = ctx.createBufferSource(); w.buffer = noise; w.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 650; bp.Q.value = 1.1;
    const wl = ctx.createOscillator(); wl.frequency.value = .06;
    const wg = ctx.createGain(); wg.gain.value = 320; wl.connect(wg); wg.connect(bp.frequency);
    const wv = ctx.createGain(); wv.gain.value = .07;
    w.connect(bp); bp.connect(wv); wv.connect(ambBus); w.start(t); wl.start(t);
    ambBus.gain.setTargetAtTime(.2, t, 2.6);              // slow fade-in
    scheduleSparkle();
  }

  function scheduleSparkle(){
    clearTimeout(timer);
    timer = setTimeout(() => {
      if (running() && on && !document.hidden) bell(PENT[Math.floor(Math.random() * PENT.length)], .05, 3.4);
      scheduleSparkle();
    }, 2800 + Math.random() * 5200);
  }

  function bell(freq, vol = .16, dur = 1.8, when = 0){
    if (!running()) return;
    const t = ctx.currentTime + when;
    [[1, 1], [2.76, .34], [5.4, .12]].forEach(([m, a]) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = freq * m;
      const g = ctx.createGain();
      const life = dur / (m > 1 ? m * .6 : 1);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(vol * a, t + .008);
      g.gain.exponentialRampToValueAtTime(.0001, t + life);
      o.connect(g); g.connect(fxBus); o.start(t); o.stop(t + life + .05);
    });
  }

  function shimmer(when = 0, vol = .07, dur = .5){
    if (!running()) return;
    const t = ctx.currentTime + when;
    const s = ctx.createBufferSource(); s.buffer = noise; s.loop = true;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 6;
    f.frequency.setValueAtTime(2400, t); f.frequency.exponentialRampToValueAtTime(9000, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * .3); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(fxBus); s.start(t); s.stop(t + dur + .05);
  }

  function riser(){
    if (!running()) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(196, t); o.frequency.exponentialRampToValueAtTime(784, t + .85);
    const g = ctx.createGain();
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.1, t + .8); g.gain.exponentialRampToValueAtTime(.0001, t + 1.1);
    o.connect(g); g.connect(fxBus); o.start(t); o.stop(t + 1.2);
    shimmer(0, .09, .9);
    bell(PENT[5], .15, 2.6, .85);
    bell(PENT[8], .09, 2.6, .95);
  }

  function play(name, k = 0){
    if (!ctx || !on || !running()) return;
    const i = Math.min(k, 5);
    switch (name){
      case 'start':  riser(); break;
      case 'next':   bell(PENT[i], .16, 1.7); bell(PENT[i + 2], .12, 1.5, .07); bell(PENT[i + 3], .09, 1.5, .14); shimmer(0, .05, .35); break;
      case 'back':   bell(PENT[4], .1, 1.1); bell(PENT[2], .1, 1.3, .09); break;
      case 'finish': [0, 2, 4, 6, 8, 9].forEach((n, j) => bell(PENT[n], .14, 2.8, j * .07)); shimmer(0, .12, 1.3); break;
      case 'tick':   bell(PENT[3 + Math.floor(Math.random() * 3)], .08, .6); break;
    }
  }

  function unlock(){
    init();
    if (ctx && ctx.state !== 'running' && on) ctx.resume().catch(() => {});
  }

  function setOn(v){
    on = v;
    try { localStorage.setItem('guessit-sound', v ? 'on' : 'off'); } catch (e) {}
    if (ctx){
      master.gain.setTargetAtTime(v ? 1 : 0, ctx.currentTime, .08);
      if (v) ctx.resume().catch(() => {});
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend().catch(() => {});
    else if (on) ctx.resume().catch(() => {});
  });

  const level = () => {
    if (!analyser) return 0;
    const d = new Uint8Array(analyser.fftSize); analyser.getByteTimeDomainData(d);
    let s = 0; for (const v of d){ const x = (v - 128) / 128; s += x * x; }
    return Math.sqrt(s / d.length);
  };

  return { unlock, play, setOn, level, get on(){ return on; }, get state(){ return ctx ? ctx.state : 'none'; } };
})();

/* ---------- optional images from the fx set ---------- */
(function applyFx(){
  const set = (key, cls, v) => {
    if (!FX[key]) return;
    document.documentElement.style.setProperty(v, `url("${FX[key]}")`);
    document.body.classList.add(cls);
  };
  set('bg', 'has-bg', '--bg-img');
  set('orb', 'has-orb', '--orb-img');
  set('runes', 'has-runes', '--runes-img');
})();

/* ---------- the orb ---------- */
const EYE = '<svg class="eye" viewBox="0 0 64 40" fill="none" aria-hidden="true">' +
  '<path d="M2 20 Q32 -5 62 20 Q32 45 2 20Z" stroke="rgba(255,236,170,.95)" stroke-width="2.2"/>' +
  '<circle cx="32" cy="20" r="9.5" fill="rgba(255,214,102,.92)"/><circle cx="32" cy="20" r="4.4" fill="#1a0b3a"/></svg>';
['orb-menu', 'orb-list', 'orb-card'].forEach(id => {
  $(id).innerHTML = `<div class="runes"></div><div class="ball">${EYE}</div><span class="ping"></span>`;
});
function pingOrb(){
  const o = $('orb-card');
  o.classList.remove('go'); void o.offsetWidth; o.classList.add('go');
  setTimeout(() => o.classList.remove('go'), 1000);
}

/* ---------- drifting stars and dust ---------- */
(function stars(){
  const cv = $('fx'), ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, parts = [], raf = 0;
  function size(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(80, W * H / 12000));
    parts = Array.from({length: n}, () => ({
      x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.7 + .4,
      vy: -(Math.random() * .28 + .05), vx: (Math.random() - .5) * .12,
      ph: Math.random() * 6.28, gold: Math.random() < .35
    }));
  }
  function draw(ts){
    ctx.clearRect(0, 0, W, H);
    for (const p of parts){
      if (!reduce){
        p.x += p.vx; p.y += p.vy;
        if (p.y < -6){ p.y = H + 6; p.x = Math.random() * W; }
        if (p.x < -6) p.x = W + 6; if (p.x > W + 6) p.x = -6;
      }
      const a = .25 + .55 * (.5 + .5 * Math.sin(ts / 900 + p.ph));
      const c = p.gold ? '245,196,81' : '190,170,255';
      ctx.beginPath();
      ctx.fillStyle = `rgba(${c},${a})`;
      ctx.shadowBlur = 8; ctx.shadowColor = `rgba(${c},.85)`;
      ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
    }
  }
  function loop(ts){ draw(ts); raf = requestAnimationFrame(loop); }
  size();
  window.addEventListener('resize', size);
  if (reduce){ draw(0); return; }
  raf = requestAnimationFrame(loop);
  document.addEventListener('visibilitychange', () => {
    cancelAnimationFrame(raf);
    if (!document.hidden) raf = requestAnimationFrame(loop);
  });
})();

/* ---------- screens ---------- */
function show(id){
  ['screen-menu','screen-list','screen-card'].forEach(s => { $(s).hidden = (s !== id); });
  const el = $(id);
  el.classList.remove('enter'); void el.offsetWidth; el.classList.add('enter');
  window.scrollTo(0, 0);
}

function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
  document.title = t().title;
  $('snd').setAttribute('aria-label', t().sound);
}

function renderMenu(){
  $('m-title').textContent = t().title;
  $('m-sub').textContent = t().sub;
  $('m-lang').textContent = t().lang;
  $('m-list').textContent = t().list;
  $('btn-continue').textContent = t().cont;
  $('lang-opts').innerHTML = [['en', 'English'], ['ar', 'العربية']].map(([v, name]) =>
    `<label class="opt"><input type="radio" name="lang" value="${v}"${lang === v ? ' checked' : ''}><span dir="auto">${name}</span></label>`
  ).join('');
  $('list-opts').innerHTML = CATEGORIES.map((c, i) =>
    `<label class="opt"><input type="radio" name="list" value="${i}"${catIndex === i ? ' checked' : ''}><span class="e" aria-hidden="true">${c.emoji}</span><span>${title(c)}</span></label>`
  ).join('');
}

function renderList(){
  $('btn-lists').textContent = t().lists;
  $('list-title').textContent = title(cat());
  $('list-hint').textContent = t().pick;
  $('start').textContent = t().start;
  const byValue = [...cat().items].sort((a, b) => a.value - b.value);
  $('list-grid').innerHTML = byValue.map((c, i) =>
    `<div class="chip" style="--i:${i}"><span class="no">${c.value}.</span>${icon(c)}<span class="nm" dir="auto">${label(c)}</span></div>`
  ).join('');
}

function renderCard(){
  const n = step + 1;
  const sorted = [...cat().items].sort((a, b) => label(a).localeCompare(label(b), lang));
  $('card-grid').innerHTML = sorted.filter(c => c.cards.includes(n)).map((c, i) =>
    `<div class="chip" style="--i:${i}">${icon(c)}<span class="nm" dir="auto">${label(c)}</span></div>`
  ).join('');
  $('card-title').textContent = title(cat());
  $('step-label').textContent = t().page(n);
  $('bar').style.width = `${(n / TOTAL) * 100}%`;
  $('orb-card').style.setProperty('--p', (n / TOTAL).toFixed(2));
  $('whisper').textContent = t().whisper[step];
  $('q').textContent = t().q;
  $('q-hint').textContent = t().hint;
  $('btn-back').textContent = t().back;
  $('btn-next').textContent = (n === TOTAL) ? t().finish : t().next;
}

function next(){
  buzz(14); pingOrb(); Sound.play(step >= TOTAL - 1 ? 'finish' : 'next', step);
  if (step >= TOTAL - 1){ step = 0; renderList(); return show('screen-list'); }
  step++;
  renderCard();
  window.scrollTo(0, 0);
}

function back(){
  Sound.play('back');
  if (step === 0){ renderList(); return show('screen-list'); }
  step--;
  renderCard();
  window.scrollTo(0, 0);
}

applyLang();
renderMenu();
$('screen-menu').classList.add('enter');

$('lang-opts').addEventListener('change', e => {
  if (e.target.name !== 'lang') return;
  Sound.play('tick');
  lang = e.target.value;
  applyLang();
  renderMenu();
  const checked = document.querySelector('#lang-opts input:checked');
  if (checked) checked.focus();
});
$('list-opts').addEventListener('change', e => {
  if (e.target.name === 'list'){ Sound.play('tick'); catIndex = Number(e.target.value); }
});
$('btn-continue').onclick = () => { buzz(10); Sound.play('start'); step = 0; renderList(); show('screen-list'); };
$('btn-lists').onclick = () => { Sound.play('back'); renderMenu(); show('screen-menu'); };
$('start').onclick = () => { buzz(10); Sound.play('start'); step = 0; renderCard(); show('screen-card'); };

/* sound: unlock on the first touch/click (browsers require a gesture), then the mute button */
['pointerdown', 'touchend', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, () => Sound.unlock(), {capture: true}));
function paintSnd(){
  const b = $('snd'); b.textContent = Sound.on ? '🔊' : '🔇';
  b.setAttribute('aria-pressed', String(Sound.on));
}
$('snd').onclick = () => { Sound.unlock(); Sound.setOn(!Sound.on); paintSnd(); if (Sound.on) setTimeout(() => Sound.play('tick'), 120); };
paintSnd();
$('btn-next').onclick = next;
$('btn-back').onclick = back;
</script>

</body>
